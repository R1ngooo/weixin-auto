name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright-core install chromium

      - name: Determine versions
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $prev = (git tag --sort=-creatordate | Where-Object { $_ -ne $tag } | Select-Object -First 1)
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous=$prev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "tag=$tag version=$version previous=$prev"

      - name: Build portable ZIP
        run: npm run build:portable

      - name: Build patch from previous release
        if: steps.version.outputs.previous != ''
        run: node scripts/build-patch.mjs --from ${{ steps.version.outputs.previous }} --to HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.zip
            dist/*.sha256
            dist/patches/*.zip
            dist/patches/*.sha256
